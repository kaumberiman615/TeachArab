  <rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="#00B4D8" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Speech Bubble: Primary Pink (#FF3B8D) with Navy outline -->
  <path d="M 50 18 C 71 18, 85 29, 85 44 C 85 59, 71 70, 52 70 C 47 70, 42 69, 37.5 66.8 C 28.5 74, 20.5 76, 19 76 C 18 76, 17.5 75, 18.2 74 C 21 69.5 22 65.5 21.2 62.5 C 16 57.5 13 51 13 44 C 13 29, 27 18, 50 18 Z"
        fill="#FF3B8D" stroke="#0A254D" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Open Book: Pure White (#FFFFFF) with Navy outline -->
