  <path d="M 50 33 C 41.5 30.5 34.5 31.5 29.5 33.5 C 28.5 33.9 27.5 34.8 27.5 36.2 L 27.5 54.5 C 27.5 55.8 28.8 56.8 30 56.5 C 35.5 54.5 42.5 54 50 57 Z"
